# À placer dans le dépôt de l'APPLI : .github/workflows/build_web.yml
# Compile la version web de Katika et la publie dans le dossier /jouer du site.
name: Build web (site)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      SITE_TOKEN: ${{ secrets.SITE_TOKEN }}

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Activer le support Web
        run: flutter config --enable-web

      - name: Installer les dépendances
        run: flutter pub get

      - name: Générer les fichiers Web manquants
        run: |
          flutter create . --platforms=web --org=com.yveslaurent85 --project-name=ludopro
          test -f web/index.html

      - name: Compiler Katika pour le Web
        run: flutter build web --release --base-href /jouer/

      - name: Conserver le résultat de compilation
        uses: actions/upload-artifact@v4
        with:
          name: katika-web
          path: build/web

      # SITE_TOKEN doit être un jeton GitHub autorisé à écrire dans
      # yveslaurent85/katikagames-web.
      - name: Publier sur le site
        if: env.SITE_TOKEN != ''
        run: |
          git clone https://x-access-token:${SITE_TOKEN}@github.com/yveslaurent85/katikagames-web site
          rm -rf site/jouer
          mkdir -p site/jouer
          cp -r build/web/. site/jouer/
          cd site
          git config user.name "Katika Bot"
          git config user.email "bot@katika.local"
          git add -A
          git commit -m "Mise à jour de la version web" || echo "Aucun changement à publier"
          git push
