# À placer dans le dépôt de l'APPLI : .github/workflows/build_web.yml
# Compile la version web de Katika et la publie dans le dossier /jouer du site.
name: Build web (site)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      SITE_TOKEN: ${{ secrets.SITE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Préparer le dossier web (créé seulement dans la machine de compilation)
        run: flutter create . --platforms web --project-name katika
      - run: flutter build web --release --base-href /jouer/
      - uses: actions/upload-artifact@v4
        with:
          name: katika-web
          path: build/web
      # Publication automatique sur le site (secret SITE_TOKEN = jeton GitHub
      # avec droit d'écriture sur yveslaurent85/katikagames-web).
      - name: Publier sur le site
        if: env.SITE_TOKEN != ''
        run: |
          git clone https://x-access-token:${SITE_TOKEN}@github.com/yveslaurent85/katikagames-web site
          rm -rf site/jouer
          cp -r build/web site/jouer
          cd site
          git config user.name "katika-bot"
          git config user.email "bot@katika.local"
          git add -A
          git commit -m "Mise à jour de la version web" || echo "Rien à publier"
          git push
