
name: Katika Web V2

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: katika-web-publication
  cancel-in-progress: false
concurrency:
  group: katika-web
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      SITE_TOKEN: ${{ secrets.SITE_TOKEN }}

    steps:
      - name: Télécharger le code de Katika
        uses: actions/checkout@v4

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Installer les dépendances
        run: flutter pub get

      - name: Préparer Flutter Web
        run: flutter create . --platforms=web --project-name katika

      - name: Compiler Katika Web
        run: flutter build web --release --base-href /katikagames-web/jouer/

      - name: Sauvegarder les fichiers compilés
        uses: actions/upload-artifact@v4
        with:
          name: katika-web
          path: build/web

      - name: Publier sur le site
        if: env.SITE_TOKEN != ''
        run: |
          git clone https://x-access-token:${SITE_TOKEN}@github.com/yveslaurent85/katikagames-web.git site

          cd site

          git config user.name "katika-bot"
          git config user.email "bot@katika.local"

          mkdir -p jouer

          cp -r ../build/web/. jouer/

          touch .nojekyll

          git add -A

          if git diff --cached --quiet; then
            echo "Le site est déjà à jour."
            exit 0
          fi

          git commit -m "Mise à jour de Katika Web"

          for attempt in 1 2 3 4 5; do
            echo "Tentative de publication $attempt"

            git fetch origin main

            if ! git rebase origin/main; then
              echo "Conflit pendant le rebase."
              git rebase --abort
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Publication de Katika réussie !"
              exit 0
            fi

            sleep 5
          done

          echo "Échec de publication après 5 tentatives."
          exit 1
