
name: Katika Web V2

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      SITE_TOKEN: ${{ secrets.SITE_TOKEN }}

    steps:
      - name: Télécharger le code de Katika
        uses: actions/checkout@v4

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Installer les dépendances
        run: flutter pub get

      - name: Préparer Flutter Web
        run: flutter create . --platforms web --project-name katika

      - name: Compiler Katika Web
        run: flutter build web --release --base-href /jouer/

      - name: Sauvegarder les fichiers compilés
        uses: actions/upload-artifact@v4
        with:
          name: katika-web
          path: build/web

      - name: Publier sur le site
        if: env.SITE_TOKEN != ''
        run: |
          git clone https://x-access-token:${SITE_TOKEN}@github.com/yveslaurent85/katikagames-web site

          cd site

          git config user.name "katika-bot"
          git config user.email "bot@katika.local"

          for attempt in 1 2 3; do
            echo "Tentative de publication $attempt"

            git fetch origin main
            git reset --hard origin/main

            rm -rf jouer
            mkdir -p jouer
            cp -r ../build/web/. jouer/

            git add -A

            git commit -m "Mise à jour de la version web" || true

            if git push origin main; then
              echo "Publication de Katika réussie !"
              exit 0
            fi

            echo "Conflit GitHub, nouvelle tentative..."
            sleep 3
          done

          echo "Échec de la publication après 3 tentatives"
          exit 1
