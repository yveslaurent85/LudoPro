name: katika
description: Katika - Ludo et Dés
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.15.0
  cloud_functions: any
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  url_launcher: ^6.3.0
  http: ^1.2.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "icon.png"
