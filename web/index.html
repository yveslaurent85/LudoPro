<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Katika - Dés et Ludo by CKY">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#061A66">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Katika">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Katika</title>
  <style>
    html, body { margin: 0; height: 100%; background: #061A66; }
    /* Écran de chargement : fond bleu et rond qui tourne, caché dès que l'appli s'affiche. */
    #katika-boot {
      position: fixed; inset: 0; z-index: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(180deg, #1F5BFF 0%, #0B2FA6 55%, #061A66 100%);
      color: #FFC21A; font: italic 900 38px Roboto, Arial, sans-serif; letter-spacing: 1px;
    }
    #katika-boot .ring {
      margin-top: 22px; width: 44px; height: 44px; border-radius: 50%;
      border: 5px solid rgba(255, 255, 255, 0.25); border-top-color: #FFC21A;
      animation: katika-spin 0.9s linear infinite;
    }
    @keyframes katika-spin { to { transform: rotate(360deg); } }
    /* Bandeau partenaire 728x90, collé en bas, réduit pour tenir sur téléphone. */
    #katika-ad {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
      height: 112px; overflow: hidden; background: #061A66;
    }
    #katika-ad .lbl {
      position: absolute; top: 0; left: 0; right: 0; height: 22px;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      font: 800 11px/1 Roboto, Arial, sans-serif; letter-spacing: .6px;
      color: #fff; text-transform: uppercase;
    }
    #katika-ad .lbl b { color: #FFC21A; }
    #katika-ad iframe {
      position: absolute; left: 0; bottom: 0; width: 728px; height: 90px;
      border: 0; margin: 0; padding: 0; transform-origin: 0 100%;
    }
  </style>
</head>
<body>
  <div id="katika-boot"><div>Katika</div><div class="ring"></div></div>
  <div id="katika-ad"><div class="lbl"><b>KATIKA</b> Partenaire officiel <b>1XBET</b></div><iframe scrolling="no" frameborder="0" width="728" height="90"
    src="https://refbanners.com/I?tag=d_6392036m_9799c_&amp;site=6392036&amp;ad=9799"></iframe></div>
  <script>
    (function () {
      function fit() {
        var w = window.innerWidth, k = Math.min(1, w / 728);
        var box = document.getElementById('katika-ad'), f = box.firstElementChild;
        box.style.height = (22 + 90 * k) + 'px';
        f.style.transform = 'scale(' + k + ')';
        f.style.left = Math.max(0, (w - 728 * k) / 2) + 'px';
      }
      fit(); window.addEventListener('resize', fit);
      // Appelé par l'appli : le bandeau n'est visible que sur la page d'accueil.
      window.katikaAd = function (mode) {
        document.getElementById('katika-ad').style.display = mode === '0' ? 'none' : 'block';
      };
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
